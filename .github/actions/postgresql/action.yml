name: PostgreSQL
description: >-
  Reads the PostgreSQL major that the root manifest declares (engines.postgresql),
  for service container images. Jobs that run PostgreSQL themselves use devenv.
outputs:
  major:
    description: The declared PostgreSQL major.
    value: ${{ steps.declared.outputs.major }}
runs:
  using: composite
  steps:
    - id: declared
      shell: bash
      run: |
        major="$(jq -er '.engines.postgresql | select(test("^[1-9][0-9]*$"))' package.json)"
        echo "major=$major" >> "$GITHUB_OUTPUT"
