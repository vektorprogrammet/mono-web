name: Checks

# Fast feedback on every push and pull request. Long suites live in tests.yml.
on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Format, lint, types, and HTTP contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: devenv shell bash -- -e {0}
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 2
        with:
          persist-credentials: false
      - uses: ./.github/actions/devenv
        timeout-minutes: 3
      - name: Build the devenv shell
        timeout-minutes: 5
        run: bun --version
      - name: Install frozen dependencies
        timeout-minutes: 3
        run: bun install --frozen-lockfile
      # Type checks run the Turbo `generate` tasks, which derive and assert the HTTP contract artifacts.
      - name: Check source safety, format, lint, types, and HTTP contract
        timeout-minutes: 12
        run: just check
