name: Docs

# Build the documentation site (apps/docs) and publish it to GitHub Pages from main.
# The repository's Pages source must be "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build documentation site
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        shell: devenv shell bash -- -e {0}
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 2
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        timeout-minutes: 1
      - uses: ./.github/actions/devenv
        timeout-minutes: 3
      - name: Build the devenv shell
        timeout-minutes: 5
        run: bun --version
      - name: Install frozen dependencies
        timeout-minutes: 3
        run: bun install --frozen-lockfile --ignore-scripts
      # Before the site build: the command requires a clean checkout at the expected revision.
      - name: Generate the Placements API reference
        timeout-minutes: 4
        env:
          PLACEMENTS_DOCS_EXPECTED_REVISION: ${{ github.sha }}
        run: bun run --cwd tools/placements-docs docs:ci "$RUNNER_TEMP/placements-api"
      - name: Build the site and check its links
        timeout-minutes: 5
        run: just docs build
      - name: Publish the Placements API reference with the site
        timeout-minutes: 1
        run: |
          mkdir -p apps/docs/dist/public/packages/domain/src/placements
          mv "$RUNNER_TEMP/placements-api" apps/docs/dist/public/packages/domain/src/placements/api
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        timeout-minutes: 2
        with:
          path: apps/docs/dist/public

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
