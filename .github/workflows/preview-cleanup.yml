name: Preview trusted cleanup

on:
  workflow_call:
    inputs:
      event:
        required: true
        type: string
      repository:
        required: false
        default: vektorprogrammet/mono-web
        type: string
      pull_request_number:
        required: true
        type: number
      head_sha:
        required: true
        type: string
      stage:
        required: false
        default: p20
        type: string
      target:
        required: false
        default: p20
        type: string
      source_digest:
        required: true
        type: string
      image_digest:
        required: true
        type: string
      seed_digest:
        required: true
        type: string
      route_contract_digest:
        required: true
        type: string
      resources_json:
        required: true
        type: string
      remote_state:
        required: false
        default: vektor/p20
        type: string
    outputs:
      state:
        value: ${{ jobs.cleanup.outputs.state }}
      ledger_key:
        value: ${{ jobs.cleanup.outputs.ledger_key }}

permissions:
  contents: read

concurrency:
  group: preview-vektor-p20
  cancel-in-progress: false

jobs:
  cleanup:
    name: Stage-scoped close or reconcile plan
    runs-on: ubuntu-latest
    environment: vektor-preview
    outputs:
      state: ${{ steps.destroy.outputs.state }}
      ledger_key: ${{ steps.destroy.outputs.ledger_key }}
    steps:
      - name: Checkout immutable base tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ inputs.repository }}
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Construct exact stage destroy plan and preserve tombstone
        id: destroy
        run: |
          set -euo pipefail
          printf '%s' '${{ inputs.resources_json }}' > "$RUNNER_TEMP/resources.json"
          common=(--repository "${{ inputs.repository }}" --pr "${{ inputs.pull_request_number }}" --head-sha "${{ inputs.head_sha }}" --app vektor --target "${{ inputs.target }}" --stage "${{ inputs.stage }}" --hostname p20.vektor.phibkro.org --resource-prefix vektor-p20 --container-name vektor-p20-container --concurrency preview-vektor-p20 --remote-state-key "${{ inputs.remote_state }}" --source-digest "${{ inputs.source_digest }}" --image-digest "${{ inputs.image_digest }}" --seed-digest "${{ inputs.seed_digest }}" --route-contract-digest "${{ inputs.route_contract_digest }}" --resources "$RUNNER_TEMP/resources.json" --output "$RUNNER_TEMP/ownership.json")
          node infra/preview/trusted/cli.mjs ownership "${common[@]}" > "$RUNNER_TEMP/ownership.stdout.json"
          lifecycle=(--store "$RUNNER_TEMP/ledger.json" --repository "${{ inputs.repository }}" --pr "${{ inputs.pull_request_number }}" --head-sha "${{ inputs.head_sha }}" --app vektor --target "${{ inputs.target }}" --stage "${{ inputs.stage }}" --hostname p20.vektor.phibkro.org --resource-prefix vektor-p20 --container-name vektor-p20-container --concurrency preview-vektor-p20 --remote-state-key "${{ inputs.remote_state }}" --source-digest "${{ inputs.source_digest }}" --image-digest "${{ inputs.image_digest }}" --seed-digest "${{ inputs.seed_digest }}" --route-contract-digest "${{ inputs.route_contract_digest }}" --ownership-manifest "$RUNNER_TEMP/ownership.json")
          node infra/preview/trusted/cli.mjs init "${lifecycle[@]}" > "$RUNNER_TEMP/ledger-init.json"
          node infra/preview/trusted/cli.mjs retire "${lifecycle[@]}" > "$RUNNER_TEMP/retiring.json"
          node infra/preview/trusted/cli.mjs destroy "${lifecycle[@]}" > "$RUNNER_TEMP/destroy-plan.json"
          node infra/preview/trusted/cli.mjs absent "${lifecycle[@]}" --manifest-digest "$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8")).manifestDigest)' "$RUNNER_TEMP/ownership.json")" > "$RUNNER_TEMP/absent.json"
          printf 'state=Absent\nledger_key=%s\n' "$(node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8")).key)' "$RUNNER_TEMP/ledger-init.json")" >> "$GITHUB_OUTPUT"
