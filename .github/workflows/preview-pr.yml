name: Worker Previews

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read

concurrency:
  group: worker-previews-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PREVIEW_NAME: pr-${{ github.event.pull_request.number }}

jobs:
  build:
    if: ${{ github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DASHBOARD_MOUNT: /
      PREVIEW_HOST_SUFFIX: .workers.dev
      PREVIEW_STAGE: worker-preview
    steps:
      - name: Checkout exact pull-request revision without credentials
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Build public homepage Preview
        working-directory: apps/homepage
        run: bun run build

      - name: Build staff dashboard Preview
        working-directory: apps/dashboard
        run: bun run build

      - name: Upload credential-free Preview bundles
        uses: actions/upload-artifact@v4
        with:
          name: worker-preview-build-${{ github.event.pull_request.head.sha }}
          path: |
            apps/homepage/build
            apps/dashboard/build
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout trusted deployment code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install trusted frozen dependencies
        run: bun install --frozen-lockfile

      - name: Download exact pull-request bundles
        uses: actions/download-artifact@v4
        with:
          name: worker-preview-build-${{ github.event.pull_request.head.sha }}
          path: .

      # On first use, `wrangler preview` creates vektor-preview-homepage and vektor-preview-dashboard
      # without a production version. The token needs Account > Workers Scripts > Edit.
      - name: Create or update isolated Worker Previews
        id: preview
        env:
          CI: "true"
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PREVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bun tools/scripts/deploy-preview.ts "${{ github.event.pull_request.number }}"

      - name: Probe application documents and built assets
        env:
          DASHBOARD_URL: ${{ steps.preview.outputs.dashboard_url }}
          HOMEPAGE_URL: ${{ steps.preview.outputs.homepage_url }}
        run: |
          set -Eeuo pipefail
          probe() {
            local url="$1"
            local body="$2"
            local headers="$3"
            for _ in {1..12}; do
              if curl --fail --location --silent --show-error --dump-header "$headers" --output "$body" "$url"; then
                grep -Eiq $'^x-mono-web-stage: worker-preview\r?$' "$headers"
                return 0
              fi
              sleep 5
            done
            return 1
          }
          probe "$HOMEPAGE_URL/health" "$RUNNER_TEMP/homepage-health.json" "$RUNNER_TEMP/homepage-health.headers"
          jq -e '.stage == "worker-preview"' "$RUNNER_TEMP/homepage-health.json" >/dev/null
          # Previews are frontend-only: `/` reads news from the API and answers 503, so probe a static page.
          probe "$HOMEPAGE_URL/om-oss" "$RUNNER_TEMP/homepage.html" "$RUNNER_TEMP/homepage.headers"
          homepage_asset="$(grep -oE '/assets/[^"[:space:]?]+' "$RUNNER_TEMP/homepage.html" | sed -n 1p)"
          test -n "$homepage_asset"
          curl --fail --silent --show-error "$HOMEPAGE_URL$homepage_asset" >/dev/null
          probe "$DASHBOARD_URL/login" "$RUNNER_TEMP/dashboard.html" "$RUNNER_TEMP/dashboard.headers"
          dashboard_asset="$(grep -oE '/assets/[^"[:space:]?]+' "$RUNNER_TEMP/dashboard.html" | sed -n 1p)"
          test -n "$dashboard_asset"
          curl --fail --silent --show-error "$DASHBOARD_URL$dashboard_asset" >/dev/null

      - name: Publish exact Preview and source links
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT: ${{ steps.preview.outputs.commit }}
          DASHBOARD_DEPLOYMENT_URL: ${{ steps.preview.outputs.dashboard_deployment_url }}
          DASHBOARD_URL: ${{ steps.preview.outputs.dashboard_url }}
          HOMEPAGE_DEPLOYMENT_URL: ${{ steps.preview.outputs.homepage_deployment_url }}
          HOMEPAGE_URL: ${{ steps.preview.outputs.homepage_url }}
          SOURCE_URL: ${{ steps.preview.outputs.source_url }}
        run: |
          set -Eeuo pipefail
          comment="$RUNNER_TEMP/worker-previews.md"
          cat > "$comment" <<EOF
          <!-- monoweb-worker-previews -->
          ## Worker Previews

          | Surface | Latest pull-request revision | Exact deployment |
          |---|---|---|
          | Public homepage | [Open Preview]($HOMEPAGE_URL) | [Open immutable deployment]($HOMEPAGE_DEPLOYMENT_URL) |
          | Staff dashboard | [Open Preview]($DASHBOARD_URL) | [Open immutable deployment]($DASHBOARD_DEPLOYMENT_URL) |

          Previews are frontend-only: pages that read the API show their unavailable state.

          Source: [\`$COMMIT\`]($SOURCE_URL)
          EOF
          payload="$RUNNER_TEMP/worker-previews.json"
          jq -Rs '{body: .}' "$comment" > "$payload"
          comment_id="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" --jq '.[] | select(.body | contains("<!-- monoweb-worker-previews -->")) | .id' | head -n 1)"
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" --input "$payload" >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --input "$payload" >/dev/null
          fi

  cleanup:
    if: ${{ github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout trusted cleanup code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install trusted frozen dependencies
        run: bun install --frozen-lockfile

      - name: Delete both Worker Previews
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -Eeuo pipefail
          delete_preview() {
            local config="$1"
            local output
            local status
            set +e
            output="$(./node_modules/.bin/wrangler preview delete --name "$PREVIEW_NAME" --skip-confirmation --ignore-base-config --config "$config" 2>&1)"
            status=$?
            set -e
            printf '%s\n' "$output"
            if (( status == 0 )); then return 0; fi
            grep -Eiq 'not found|does not exist|404' <<<"$output"
          }
          result=0
          delete_preview infra/previews/homepage.wrangler.json || result=1
          delete_preview infra/previews/dashboard.wrangler.json || result=1
          exit "$result"

      - name: Remove Preview review comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -Eeuo pipefail
          comment_id="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" --jq '.[] | select(.body | contains("<!-- monoweb-worker-previews -->")) | .id' | head -n 1)"
          if [[ -n "$comment_id" ]]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id"
          fi
