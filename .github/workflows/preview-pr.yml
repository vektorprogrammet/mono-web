name: PR preview p20

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, closed]
  workflow_dispatch:
    inputs:
      action:
        description: reconcile or main-dev
        required: true
        default: reconcile
        type: choice
        options: [reconcile, main-dev]
      head_sha:
        description: exact approved head SHA
        required: false
        type: string
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: preview-vektor-p20
  cancel-in-progress: false

env:
  PREVIEW_APP: vektor
  PREVIEW_STAGE: p20
  PREVIEW_TARGET: p20
  PREVIEW_PR: "21"
  PREVIEW_HOST: p20.vektor.phibkro.org
  PREVIEW_CONTAINER: vektor-p20-container

jobs:
  credential-free:
    if: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    outputs:
      head_sha: ${{ steps.head.outputs.sha }}
      source_digest: ${{ steps.digest.outputs.source_digest }}
    steps:
      - name: Checkout exact pull request revision
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Record exact head
        id: head
        run: echo "sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
      - name: Compute source digest
        id: digest
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          printf 'source_digest=sha256:%s\n' "$(git archive --format=tar HEAD | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Verify forbidden production boundary
        run: |
          set -Eeuo pipefail
          if git grep -n -I 'vektorprogrammet\.no' -- . ':!design-specs/**' ':!docs/**'; then
            echo "Preview source contains forbidden production host" >&2
            exit 1
          fi

  trusted-delivery:
    needs: credential-free
    if: ${{ github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository }}
    uses: ./.github/workflows/preview-trusted.yml
    with:
      event: ${{ github.event.action }}
      repository: ${{ github.repository }}
      pull_request_number: 21
      head_sha: ${{ needs.credential-free.outputs.head_sha }}
      stage: p20
      target: p20
      plan_only: true
      expected_source_digest: ${{ needs.credential-free.outputs.source_digest }}
      image_digest: sha256:preview-image-digest-required
      seed_digest: sha256:preview-seed-digest-required
      route_contract_digest: sha256:generated-at-review-time
      resources_json: '[{"type":"worker","id":"vektor-p20-worker"},{"type":"durable-object-namespace","id":"vektor-p20-preview-container-namespace"},{"type":"durable-object-migration","id":"vektor-p20-preview-container-migration"},{"type":"container","id":"vektor-p20-container","name":"vektor-p20-container"},{"type":"container-image","id":"vektor-p20-container-image"},{"type":"homepage","id":"vektor-p20-homepage"},{"type":"dashboard","id":"vektor-p20-dashboard"},{"type":"route","id":"vektor-p20-route"},{"type":"dns-tls","id":"vektor-p20-dns-tls"},{"type":"seed-artifact","id":"vektor-p20-seed-artifact"}]'
      remote_state: vektor/p20
    secrets: inherit

  close:
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'closed' }}
    uses: ./.github/workflows/preview-cleanup.yml
    with:
      event: closed
      repository: ${{ github.repository }}
      pull_request_number: 21
      head_sha: ${{ github.event.pull_request.head.sha }}
      stage: p20
      target: p20
      source_digest: sha256:close-source-digest-required
      image_digest: sha256:preview-image-digest-required
      seed_digest: sha256:preview-seed-digest-required
      route_contract_digest: sha256:generated-at-review-time
      resources_json: '[{"type":"worker","id":"vektor-p20-worker"},{"type":"durable-object-namespace","id":"vektor-p20-preview-container-namespace"},{"type":"durable-object-migration","id":"vektor-p20-preview-container-migration"},{"type":"container","id":"vektor-p20-container","name":"vektor-p20-container"},{"type":"container-image","id":"vektor-p20-container-image"},{"type":"homepage","id":"vektor-p20-homepage"},{"type":"dashboard","id":"vektor-p20-dashboard"},{"type":"route","id":"vektor-p20-route"},{"type":"dns-tls","id":"vektor-p20-dns-tls"},{"type":"seed-artifact","id":"vektor-p20-seed-artifact"}]'
      remote_state: vektor/p20
    secrets: inherit

  reconcile:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    uses: ./.github/workflows/preview-cleanup.yml
    with:
      event: reconcile
      repository: ${{ github.repository }}
      pull_request_number: 21
      head_sha: ${{ inputs.head_sha || github.sha }}
      stage: p20
      target: p20
      source_digest: sha256:reconcile-source-digest-required
      image_digest: sha256:preview-image-digest-required
      seed_digest: sha256:preview-seed-digest-required
      route_contract_digest: sha256:generated-at-review-time
      resources_json: '[{"type":"worker","id":"vektor-p20-worker"},{"type":"durable-object-namespace","id":"vektor-p20-preview-container-namespace"},{"type":"durable-object-migration","id":"vektor-p20-preview-container-migration"},{"type":"container","id":"vektor-p20-container","name":"vektor-p20-container"},{"type":"container-image","id":"vektor-p20-container-image"},{"type":"homepage","id":"vektor-p20-homepage"},{"type":"dashboard","id":"vektor-p20-dashboard"},{"type":"route","id":"vektor-p20-route"},{"type":"dns-tls","id":"vektor-p20-dns-tls"},{"type":"seed-artifact","id":"vektor-p20-seed-artifact"}]'
      remote_state: vektor/p20
    secrets: inherit
