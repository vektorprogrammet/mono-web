name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgresql:
    name: PostgreSQL target
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      major: ${{ steps.postgresql.outputs.major }}
      majors: ${{ steps.postgresql.outputs.majors }}
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 2
        with:
          persist-credentials: false
          sparse-checkout: |
            /package.json
            /.github/actions/
          sparse-checkout-cone-mode: false
      - name: Read supported PostgreSQL majors
        id: postgresql
        uses: ./.github/actions/postgresql

  placements-docs:
    name: Placements documentation (required-capable gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PLACEMENTS_DOCS_EXPECTED_REVISION: ${{ github.sha }}
    defaults:
      run:
        shell: devenv shell bash -- -e {0}
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 2
        with:
          persist-credentials: false
      - uses: ./.github/actions/devenv
        timeout-minutes: 3
      - name: Build the devenv shell
        timeout-minutes: 5
        run: bun --version
      - name: Install frozen documentation dependencies
        timeout-minutes: 3
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Check retained-artifact rejection rules
        timeout-minutes: 1
        run: bun test tools/placements-docs/placements-artifact.test.mjs
      - name: Check examples and generate exact-source reference
        id: docs
        timeout-minutes: 4
        run: bun run --cwd tools/placements-docs docs:ci "$RUNNER_TEMP/placements-docs"
      - name: Accept retained documentation without regeneration
        timeout-minutes: 1
        run: bun run --cwd tools/placements-docs docs:accept "$RUNNER_TEMP/placements-docs"
      - name: Upload complete public documentation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        timeout-minutes: 2
        with:
          name: placements-docs-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/placements-docs
          if-no-files-found: error
          retention-days: 1
      - name: Remove disposable documentation
        if: ${{ always() }}
        timeout-minutes: 1
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/placements-docs"

  golden-school-service:
    name: Golden school-service (required functional gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    defaults:
      run:
        shell: devenv shell bash -- -e {0}
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 2
        with:
          persist-credentials: false
      - uses: ./.github/actions/devenv
        timeout-minutes: 3
      - name: Build the devenv shell
        timeout-minutes: 5
        run: bun --version
      - name: Install frozen dependencies
        timeout-minutes: 3
        run: bun install --frozen-lockfile
      - name: Reject unsafe golden evidence regressions
        timeout-minutes: 1
        run: bun test tools/e2e/golden-school-service-evidence.test.mjs
      - name: Install diagnostic tools
        timeout-minutes: 2
        shell: bash
        run: sudo apt-get install --yes unzip
      - name: Run required golden journey and accept exact-source evidence
        id: golden
        timeout-minutes: 17
        env:
          GOLDEN_EXPECTED_REVISION: ${{ github.sha }}
        run: >-
          bun --no-env-file tools/e2e/golden-school-service-ci.mjs
          "${{ runner.temp }}/golden-school-service-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: Upload only sanitized golden evidence
        timeout-minutes: 2
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: golden-school-service-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 1
          if-no-files-found: error
          path: ${{ steps.golden.outputs.artifact_paths }}

  # One lane per supported PostgreSQL major. The default major runs every suite. The
  # other majors run the backend and database suites, which exercise PostgreSQL.
  ts:
    name: >-
      ${{ matrix.postgres == needs.postgresql.outputs.major && 'TypeScript (build, test)'
      || format('TypeScript (backend and database tests, PostgreSQL {0})', matrix.postgres) }}
    runs-on: ubuntu-latest
    needs: postgresql
    strategy:
      fail-fast: false
      matrix:
        postgres: ${{ fromJSON(needs.postgresql.outputs.majors) }}
    env:
      # devenv puts this major on PATH; tools/postgres rejects any other one.
      VEKTOR_POSTGRES_MAJOR: ${{ matrix.postgres }}
    defaults:
      run:
        shell: devenv shell bash -- -e {0}
    services:
      receipt-postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_DB: receipt_proof
          POSTGRES_USER: receipt
          POSTGRES_PASSWORD: receipt
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U receipt -d receipt_proof"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/devenv

      - name: Build the devenv shell
        run: bun --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        if: ${{ matrix.postgres == needs.postgresql.outputs.major }}
        run: just build

      # One package at a time, as the pre-push hook runs them. The runner has 4 vCPUs, and
      # concurrent suites that each start PGlite, PostgreSQL clusters, and worker pools time out.
      - name: Test
        if: ${{ matrix.postgres == needs.postgresql.outputs.major }}
        run: just test --concurrency=1

      - name: Test backend and database
        if: ${{ matrix.postgres != needs.postgresql.outputs.major }}
        run: just test --concurrency=1 --filter=@vektorprogrammet/backend --filter=@vektorprogrammet/database

      - name: Prove Receipt authority against PostgreSQL
        env:
          BACKEND_PG_URL: postgres://receipt:receipt@127.0.0.1:55432/receipt_proof
        run: bun run --cwd packages/database proof:receipt

  identity-evidence:
    name: Native identity (PostgreSQL lifecycle)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: postgresql
    permissions:
      contents: read
    defaults:
      run:
        shell: devenv shell bash -- -e {0}
    services:
      identity-postgres:
        image: postgres:${{ needs.postgresql.outputs.major }}-alpine
        env:
          POSTGRES_DB: identity_proof_0054
          POSTGRES_USER: identity
          POSTGRES_PASSWORD: identity
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U identity -d identity_proof_0054"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Create private identity evidence directory
        shell: bash
        run: install -d -m 700 "$RUNNER_TEMP/native-identity-0054"

      - uses: ./.github/actions/devenv

      - name: Build the devenv shell
        run: bun --version

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Prove Better Auth PostgreSQL lifecycle
        env:
          DATABASE_URL: postgres://identity:identity@127.0.0.1:55433/identity_proof_0054
        run: |
          set -Eeuo pipefail
          proof_path="$RUNNER_TEMP/native-identity-0054/postgres-proof.json"
          bun run --cwd packages/database proof:identity-postgres | tee "$proof_path"
          test -s "$proof_path"

      # The proof leaves Better Auth signing keys encrypted with its own secret. The focused tests
      # use another secret, so they run on a database of their own.
      - name: Run focused AuthLive PostgreSQL lifecycle tests
        env:
          AUTH_TEST_PG_URL: postgres://identity:identity@127.0.0.1:55433/identity_auth_live_test
        run: |
          psql postgres://identity:identity@127.0.0.1:55433/identity_proof_0054 \
            --set=ON_ERROR_STOP=1 --command='CREATE DATABASE identity_auth_live_test'
          bun run --cwd packages/database test -- src/auth-live.test.ts

      - name: Upload sanitized native identity evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-identity-0054-${{ github.sha }}
          path: ${{ runner.temp }}/native-identity-0054
          if-no-files-found: error
          retention-days: 1

  identity-browser-evidence:
    name: Native identity browser evidence (fresh PostgreSQL and Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: devenv shell bash -- -e {0}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/devenv
      - name: Build the devenv shell
        run: bun --version
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Create private identity browser evidence directory
        run: install -d -m 700 "$RUNNER_TEMP/native-identity-0065"
      - name: Run bounded native Identity browser capsule
        env:
          CI: "true"
        run: |
          set -Eeuo pipefail
          bun run --cwd apps/dashboard e2e:real-identity \
            | tee "$RUNNER_TEMP/native-identity-0065/receipt.json"
          test -s "$RUNNER_TEMP/native-identity-0065/receipt.json"
      - name: Upload sanitized native Identity evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-identity-0065-${{ github.sha }}
          path: ${{ runner.temp }}/native-identity-0065
          if-no-files-found: error
          retention-days: 1
  applicant-evidence:
    name: Public applicant (PostgreSQL and Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: devenv shell bash -- -e {0}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Create private evidence directory
        shell: bash
        run: install -d -m 700 "$RUNNER_TEMP/public-applicant-admission"

      - uses: ./.github/actions/devenv

      - name: Build the devenv shell
        run: bun --version

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Run bounded public-applicant journey
        env:
          CI: "true"
          PUBLIC_APPLICATION_REMOTE_EVIDENCE: "1"
          PUBLIC_APPLICATION_EVIDENCE_PATH: ${{ runner.temp }}/public-applicant-admission/evidence.json
        run: |
          set -Eeuo pipefail
          evidence_dir="${RUNNER_TEMP}/public-applicant-admission"
          /usr/bin/time \
            --verbose \
            --output="$evidence_dir/resources.txt" \
            timeout --signal=TERM --kill-after=4m 15m \
            bun run --cwd apps/homepage e2e:applicant:real
          test -s "$PUBLIC_APPLICATION_EVIDENCE_PATH"

      - name: Upload sanitized applicant evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-applicant-admission-${{ github.sha }}
          path: ${{ runner.temp }}/public-applicant-admission
          if-no-files-found: error
          retention-days: 1
