services:
  # Symfony monolith (PHP 8.4 + MySQL)
  server:
    build:
      context: ./apps/server
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://vektor:vektor@mysql:3306/vektor?serverVersion=8.0
      APP_ENV: dev

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: vektor
      MYSQL_USER: vektor
      MYSQL_PASSWORD: vektor
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
