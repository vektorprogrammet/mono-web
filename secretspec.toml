#:schema https://secretspec.dev/schema/secretspec.schema.json
# Declares the secrets that commands need; the values live in Bitwarden Secrets Manager.
# `secretspec run --profile <profile> -- <command>` gives them to that one command.
# The bws provider reads the machine-account token from BWS_ACCESS_TOKEN.
[project]
name = "mono-web"
revision = "1.0"

[providers]
bitwarden = { uri = "bws://2ddfeed1-59d8-4139-b6b0-b4d1001edcfc" }

# Pull-request Worker Previews: `.github/workflows/preview-pr.yml` deploys and deletes them.
[profiles.preview.defaults]
providers = ["bitwarden"]

[profiles.preview]
CLOUDFLARE_API_TOKEN = { description = "Account-owned Cloudflare API token with Workers Editor on vektor-preview-homepage and vektor-preview-dashboard only", ref = { item = "WORKERS_EDIT_CLOUDFLARE_API_TOKEN" } }
CLOUDFLARE_ACCOUNT_ID = { description = "Cloudflare account that owns the preview Workers" }
